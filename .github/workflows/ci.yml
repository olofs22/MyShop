name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/MyShop.slnx

      - name: Build
        run: dotnet build backend/MyShop.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/MyShop.slnx --no-build --configuration Release